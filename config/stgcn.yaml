# STGCN 动作识别模型（30 帧骨架序列，7 类）
# model_path 可写相对本 yaml 的路径或绝对路径
model_path: ~/.cache/models/vision/stgcn/stgcn.fp32.onnx
class: deploy.stgcn.StgcnActionRecognizer
# Packaged next to this yaml; also matches model_zoo assets/labels/stgcn.txt
label_file_path: stgcn.txt

default_params:
  num_threads: 4
  providers:
    - CPUExecutionProvider
